<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jerry's Singing Tuner</title>
  <meta name="description" content="Play a note on the keyboard, sing it back, and see how close you are." />
  <meta name="theme-color" content="#111318" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tuner" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111318;
      color: #f5f7fb;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    button,
    .white-key,
    .black-key {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    h1, h2 {
      margin-top: 0;
    }

    .subtitle {
      color: #b9c0cc;
      margin-bottom: 18px;
    }

    .topbar,
    .panel {
      background: #1a1f28;
      border: 1px solid #2d3441;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    button,
    input {
      background: #0f1319;
      color: #f5f7fb;
      border: 1px solid #3a4354;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    .keyboard-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      align-items: end;
      justify-content: center;
    }

    .keyboard-controls label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
    }

    .octave-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .range-label {
      color: #c8d0dd;
      font-weight: 600;
      padding: 10px 12px;
      background: #10141b;
      border: 1px solid #30394a;
      border-radius: 10px;
    }

    .keyboard {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 0;
      min-height: 220px;
      border: 1px solid #30394a;
      border-radius: 12px;
      background: #10141b;
      display: flex;
      justify-content: center;
    }

    .keyboard-inner {
      position: relative;
      height: 220px;
      margin: 10px auto;
    }

    .white-key {
      position: absolute;
      top: 0;
      background: linear-gradient(to bottom, #ffffff 0%, #eef1f6 100%);
      border: 1px solid #b5bcc8;
      border-radius: 0 0 8px 8px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      color: #111;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 1;
      touch-action: manipulation;
    }

    .white-key.active {
      background: linear-gradient(to bottom, #dfe5ef 0%, #cfd7e4 100%);
    }

    .black-key {
      position: absolute;
      top: 0;
      background: linear-gradient(to bottom, #2f3440 0%, #090b10 100%);
      border: 1px solid #000;
      border-radius: 0 0 6px 6px;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      color: white;
      font-size: 0.72rem;
      font-weight: 600;
      touch-action: manipulation;
    }

    .black-key.active {
      background: linear-gradient(to bottom, #4a5263 0%, #1d222d 100%);
    }

    .graph-wrap {
      margin: 4px 0 14px 0;
    }

    .graph-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
      color: #9aa3b2;
      font-size: 0.85rem;
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -1px;
    }

    .legend .l-target::before { background: rgba(88, 166, 255, 0.6); }
    .legend .l-good::before { background: #3ddc84; }
    .legend .l-near::before { background: #ffd166; }
    .legend .l-off::before { background: #ff6b6b; }

    .graph-buttons {
      display: flex;
      gap: 8px;
    }

    .graph-buttons button {
      padding: 6px 10px;
      font-size: 14px;
    }

    #pitchGraph {
      display: block;
      width: 100%;
      height: 440px;
      border: 1px solid #30394a;
      border-radius: 12px;
      background: #0c1016;
      touch-action: none;
      cursor: grab;
    }

    #pitchGraph.dragging {
      cursor: grabbing;
    }

    .graph-buttons button.active {
      border-color: #58a6ff;
      color: #9fcbff;
    }

    .hint {
      color: #6f7887;
    }

    @media (max-width: 780px) {
      .keyboard-inner {
        height: 180px;
      }

      .keyboard {
        min-height: 180px;
        justify-content: flex-start;
      }

      .app {
        padding-top: 12px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .keyboard-controls label {
        min-width: 0;
        flex: 1 1 100%;
      }

      #pitchGraph {
        height: min(62vh, 480px);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Jerry's Singing Tuner</h1>
    <p class="subtitle">Play a note, then sing it and watch your pitch on the graph.</p>

    <section class="topbar">
      <button id="micBtn">Enable Mic</button>
      <span id="status">Mic off</span>
    </section>

    <section class="panel">
      <h2>Keyboard</h2>

      <div class="keyboard-controls">
        <label>
          Volume
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.22" />
        </label>

        <div class="octave-controls">
          <button id="octaveDownBtn">Octave Down</button>
          <button id="octaveUpBtn">Octave Up</button>
          <div id="rangeLabel" class="range-label">Range: C3 to C5</div>
        </div>
      </div>

      <div id="keyboard" class="keyboard"></div>
    </section>

    <section class="panel">
      <h2>Pitch Graph</h2>

      <div class="graph-wrap">
        <div class="graph-toolbar">
          <div class="legend">
            <span class="l-target">Played note</span>
            <span class="l-good">In tune</span>
            <span class="l-near">Close</span>
            <span class="l-off">Off</span>
            <span class="hint">Drag to scroll</span>
          </div>
          <div class="graph-buttons">
            <button id="followBtn" class="active">Follow</button>
            <button id="pauseGraphBtn">Pause</button>
            <button id="clearGraphBtn">Clear</button>
          </div>
        </div>
        <canvas id="pitchGraph"></canvas>
      </div>

    </section>
  </main>

  <script>
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;

    let audioCtx = null;
    let masterGain = null;
    let analyser = null;
    let micSource = null;
    let tunerData = null;
    let tunerActive = false;
    let activeVoices = new Map();
    let targetMidi = null;

    let displayStartOctave = 3;
    const displayedOctaves = 2;
    const includeTopC = true;

    const micBtn = document.getElementById("micBtn");
    const octaveDownBtn = document.getElementById("octaveDownBtn");
    const octaveUpBtn = document.getElementById("octaveUpBtn");
    const rangeLabel = document.getElementById("rangeLabel");

    const statusEl = document.getElementById("status");
    const keyboardEl = document.getElementById("keyboard");
    const volumeEl = document.getElementById("volume");

    const graphCanvas = document.getElementById("pitchGraph");
    const graphCtx = graphCanvas.getContext("2d");
    const followBtn = document.getElementById("followBtn");
    const pauseGraphBtn = document.getElementById("pauseGraphBtn");
    const clearGraphBtn = document.getElementById("clearGraphBtn");

    const GRAPH_WINDOW = 8;          // seconds of history shown
    const MIN_FREQ = 60;             // Hz, below this the detector is unreliable
    const MAX_FREQ = 1500;
    const pitchSamples = [];         // { t, midi (float) | null, ref (midi int) | null }
    const targetEvents = [];         // { midi, start, end | null }
    const activeTargetEvents = new Map();
    let graphPaused = false;
    let graphFrozenAt = 0;
    const VIEW_SPAN = 12;            // semitones visible at once (one octave)
    const VIEW_MIN = 24;             // C1
    const VIEW_MAX = 96;             // C7
    const PAD = { left: 36, right: 8, top: 6, bottom: 18 };
    let viewLow = null;              // bottom edge of the visible range, in MIDI
    let scrollTargetLow = null;      // where auto-follow is easing the view to
    let followMode = true;
    let drag = null;
    let recentFreqs = [];

    const whiteNotes = [
      { name: "C", semitone: 0 },
      { name: "D", semitone: 2 },
      { name: "E", semitone: 4 },
      { name: "F", semitone: 5 },
      { name: "G", semitone: 7 },
      { name: "A", semitone: 9 },
      { name: "B", semitone: 11 }
    ];

    const blackNotes = [
      { name: "C#", semitone: 1, afterWhiteIndex: 0 },
      { name: "D#", semitone: 3, afterWhiteIndex: 1 },
      { name: "F#", semitone: 6, afterWhiteIndex: 3 },
      { name: "G#", semitone: 8, afterWhiteIndex: 4 },
      { name: "A#", semitone: 10, afterWhiteIndex: 5 }
    ];

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function noteNameFromMidi(midi) {
      const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
      return `${names[midi % 12]}${Math.floor(midi / 12) - 1}`;
    }

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContextClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = parseFloat(volumeEl.value);
        masterGain.connect(audioCtx.destination);
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function createPianoVoice(frequency) {
        const now = audioCtx.currentTime;

        const partials = [
            { ratio: 1.0, gain: 1.0, type: "triangle" },
            { ratio: 2.0, gain: 0.42, type: "sine" },
            { ratio: 3.0, gain: 0.18, type: "sine" },
            { ratio: 4.0, gain: 0.10, type: "sine" }
        ];

        const voiceOutput = audioCtx.createGain();
        voiceOutput.gain.value = 1.0;

        const lowpass = audioCtx.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.setValueAtTime(5000, now);
        lowpass.frequency.exponentialRampToValueAtTime(2200, now + 0.18);
        lowpass.Q.value = 0.7;

        const bodyGain = audioCtx.createGain();
        bodyGain.gain.setValueAtTime(0.0001, now);
        bodyGain.gain.exponentialRampToValueAtTime(0.95, now + 0.005);
        bodyGain.gain.exponentialRampToValueAtTime(0.32, now + 0.16);
        // stays at sustain level until noteOff()

        const oscillators = [];

        partials.forEach((partial, i) => {
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();

            osc.type = partial.type;
            osc.frequency.setValueAtTime(frequency * partial.ratio, now);

            const detuneAmount = i === 0 ? 0 : (i % 2 === 0 ? -2.5 : 2.5);
            osc.detune.setValueAtTime(detuneAmount, now);

            oscGain.gain.setValueAtTime(partial.gain, now);

            osc.connect(oscGain);
            oscGain.connect(lowpass);
            osc.start(now);

            oscillators.push({ osc, oscGain });
        });

        const attackNoiseBuffer = audioCtx.createBuffer(
            1,
            Math.floor(audioCtx.sampleRate * 0.025),
            audioCtx.sampleRate
        );
        const channelData = attackNoiseBuffer.getChannelData(0);
        for (let i = 0; i < channelData.length; i++) {
            channelData[i] = (Math.random() * 2 - 1) * (1 - i / channelData.length);
        }

        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = attackNoiseBuffer;

        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = "bandpass";
        noiseFilter.frequency.value = 2800;
        noiseFilter.Q.value = 0.9;

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.0001, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.07, now + 0.002);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);

        noiseSource.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(lowpass);
        noiseSource.start(now);

        lowpass.connect(bodyGain);
        bodyGain.connect(voiceOutput);
        voiceOutput.connect(masterGain);

        return {
            output: voiceOutput,
            bodyGain,
            lowpass,
            oscillators,
            noiseSource,
            released: false,

            stop() {
            if (this.released) return;
            this.released = true;

            const releaseStart = audioCtx.currentTime;
            const releaseEnd = releaseStart + 0.35;

            try {
                bodyGain.gain.cancelScheduledValues(releaseStart);
                bodyGain.gain.setValueAtTime(
                Math.max(bodyGain.gain.value, 0.0001),
                releaseStart
                );
                bodyGain.gain.exponentialRampToValueAtTime(0.0001, releaseEnd);
            } catch (e) {}

            try {
                lowpass.frequency.cancelScheduledValues(releaseStart);
                lowpass.frequency.setValueAtTime(
                Math.max(lowpass.frequency.value, 200),
                releaseStart
                );
                lowpass.frequency.exponentialRampToValueAtTime(800, releaseEnd);
            } catch (e) {}

            oscillators.forEach(({ osc }) => {
                try { osc.stop(releaseEnd + 0.03); } catch (e) {}
            });

            try { noiseSource.stop(releaseStart); } catch (e) {}

            setTimeout(() => {
                try { voiceOutput.disconnect(); } catch (e) {}
                try { lowpass.disconnect(); } catch (e) {}
                try { bodyGain.disconnect(); } catch (e) {}

                oscillators.forEach(({ osc, oscGain }) => {
                try { osc.disconnect(); } catch (e) {}
                try { oscGain.disconnect(); } catch (e) {}
                });

                try { noiseFilter.disconnect(); } catch (e) {}
                try { noiseGain.disconnect(); } catch (e) {}
            }, 500);
            }
        };
    }

    function noteOn(midi) {
      ensureAudio();
      if (activeVoices.has(midi)) return;

      const frequency = midiToFreq(midi);
      const voice = createPianoVoice(frequency);

      activeVoices.set(midi, voice);
      targetMidi = midi;

      const ev = { midi, start: nowSec(), end: null };
      targetEvents.push(ev);
      activeTargetEvents.set(midi, ev);
    }

    function noteOff(midi) {
      if (!audioCtx || !activeVoices.has(midi)) return;
      const voice = activeVoices.get(midi);
      voice.stop();
      activeVoices.delete(midi);

      const ev = activeTargetEvents.get(midi);
      if (ev) {
        ev.end = nowSec();
        activeTargetEvents.delete(midi);
      }
    }

    function attachKeyHandlers(el, midi) {
      const start = (ev) => {
        ev.preventDefault();
        noteOn(midi);
        el.classList.add("active");
      };

      const end = (ev) => {
        ev.preventDefault();
        noteOff(midi);
        el.classList.remove("active");
      };

      el.addEventListener("pointerdown", start);
      el.addEventListener("pointerup", end);
      el.addEventListener("pointerleave", end);
      el.addEventListener("pointercancel", end);
    }

    function buildKeyboard() {
      keyboardEl.innerHTML = "";

      const inner = document.createElement("div");
      inner.className = "keyboard-inner";

      const mobile = window.innerWidth <= 780;
      const whiteKeyWidth = mobile ? 46 : 56;
      const blackKeyWidth = mobile ? 28 : 34;
      const whiteKeyHeight = mobile ? 180 : 220;
      const blackKeyHeight = mobile ? 105 : 130;
      const whiteSpacing = whiteKeyWidth + 2;

      const totalWhiteKeys = displayedOctaves * 7 + (includeTopC ? 1 : 0);
      inner.style.width = `${totalWhiteKeys * whiteSpacing}px`;
      inner.style.height = `${whiteKeyHeight}px`;

      const allWhiteKeys = [];
      const allBlackKeys = [];

      for (let octaveOffset = 0; octaveOffset < displayedOctaves; octaveOffset++) {
        const octave = displayStartOctave + octaveOffset;

        whiteNotes.forEach((note, i) => {
          const midi = 12 * (octave + 1) + note.semitone;
          const key = document.createElement("div");
          key.className = "white-key";
          key.textContent = `${note.name}${octave}`;
          key.style.width = `${whiteKeyWidth}px`;
          key.style.height = `${whiteKeyHeight}px`;
          key.style.left = `${(octaveOffset * 7 + i) * whiteSpacing}px`;
          attachKeyHandlers(key, midi);
          allWhiteKeys.push(key);
        });

        blackNotes.forEach((note) => {
          const midi = 12 * (octave + 1) + note.semitone;
          const key = document.createElement("div");
          key.className = "black-key";
          key.textContent = note.name;
          key.style.width = `${blackKeyWidth}px`;
          key.style.height = `${blackKeyHeight}px`;

          const whitePos = octaveOffset * 7 + note.afterWhiteIndex;
          const left = whitePos * whiteSpacing + whiteKeyWidth - (blackKeyWidth / 2);
          key.style.left = `${left}px`;

          attachKeyHandlers(key, midi);
          allBlackKeys.push(key);
        });
      }

      if (includeTopC) {
        const topOctave = displayStartOctave + displayedOctaves;
        const midi = 12 * (topOctave + 1);
        const key = document.createElement("div");
        key.className = "white-key";
        key.textContent = `C${topOctave}`;
        key.style.width = `${whiteKeyWidth}px`;
        key.style.height = `${whiteKeyHeight}px`;
        key.style.left = `${displayedOctaves * 7 * whiteSpacing}px`;
        attachKeyHandlers(key, midi);
        allWhiteKeys.push(key);
      }

      allWhiteKeys.forEach(key => inner.appendChild(key));
      allBlackKeys.forEach(key => inner.appendChild(key));

      keyboardEl.appendChild(inner);

      const endOctave = displayStartOctave + displayedOctaves;
      rangeLabel.textContent = `Range: C${displayStartOctave} to C${endOctave}`;
    }

    function autoCorrelate(buf, sampleRate) {
      let rms = 0;
      for (let i = 0; i < buf.length; i++) {
        rms += buf[i] * buf[i];
      }
      rms = Math.sqrt(rms / buf.length);
      if (rms < 0.01) return -1;

      let r1 = 0;
      let r2 = buf.length - 1;
      const threshold = 0.2;

      for (let i = 0; i < buf.length / 2; i++) {
        if (Math.abs(buf[i]) < threshold) {
          r1 = i;
          break;
        }
      }

      for (let i = 1; i < buf.length / 2; i++) {
        if (Math.abs(buf[buf.length - i]) < threshold) {
          r2 = buf.length - i;
          break;
        }
      }

      buf = buf.slice(r1, r2);
      const c = new Array(buf.length).fill(0);

      for (let i = 0; i < buf.length; i++) {
        for (let j = 0; j < buf.length - i; j++) {
          c[i] += buf[j] * buf[j + i];
        }
      }

      let d = 0;
      while (d + 1 < c.length && c[d] > c[d + 1]) {
        d++;
      }

      let maxPos = -1;
      let maxVal = -1;
      for (let i = d; i < c.length; i++) {
        if (c[i] > maxVal) {
          maxVal = c[i];
          maxPos = i;
        }
      }

      let T0 = maxPos;
      if (T0 <= 0) return -1;

      const x1 = c[T0 - 1] || 0;
      const x2 = c[T0] || 0;
      const x3 = c[T0 + 1] || 0;
      const a = (x1 + x3 - 2 * x2) / 2;
      const b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);

      return sampleRate / T0;
    }

    async function enableMic() {
      ensureAudio();

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      tunerData = new Float32Array(analyser.fftSize);

      micSource = audioCtx.createMediaStreamSource(stream);
      micSource.connect(analyser);

      tunerActive = true;
      statusEl.textContent = "Mic enabled";
    }

    function nowSec() {
      return performance.now() / 1000;
    }

    function midiFloatFromFreq(freq) {
      return 12 * Math.log2(freq / 440) + 69;
    }

    function resizeGraph() {
      const dpr = window.devicePixelRatio || 1;
      const rect = graphCanvas.getBoundingClientRect();
      graphCanvas.width = Math.max(1, Math.round(rect.width * dpr));
      graphCanvas.height = Math.max(1, Math.round(rect.height * dpr));
    }

    function pruneHistory(now) {
      const cutoff = now - GRAPH_WINDOW - 1;
      while (pitchSamples.length && pitchSamples[0].t < cutoff) {
        pitchSamples.shift();
      }
      for (let i = targetEvents.length - 1; i >= 0; i--) {
        const ev = targetEvents[i];
        if (ev.end !== null && ev.end < cutoff) targetEvents.splice(i, 1);
      }
    }

    function traceColor(absCents) {
      if (absCents <= 10) return "#3ddc84";
      if (absCents <= 25) return "#ffd166";
      return "#ff6b6b";
    }

    function drawGraph(now) {
      const dpr = window.devicePixelRatio || 1;
      const ctx = graphCtx;
      const w = graphCanvas.width / dpr;
      const h = graphCanvas.height / dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const leftPad = PAD.left;
      const rightPad = PAD.right;
      const topPad = PAD.top;
      const botPad = PAD.bottom;
      const plotW = w - leftPad - rightPad;
      const plotH = h - topPad - botPad;

      // Vertical range: one octave, scrolled by hand or by auto-follow.
      if (viewLow === null) {
        viewLow = 12 * (displayStartOctave + 1) + 12 - VIEW_SPAN / 2;
      }
      if (followMode) {
        const focus = focusMidi(now);
        if (focus !== null) {
          const margin = 1.5;
          if (focus < viewLow + margin || focus > viewLow + VIEW_SPAN - margin) {
            scrollTargetLow = focus - VIEW_SPAN / 2;
          }
        }
      }
      if (scrollTargetLow !== null) {
        scrollTargetLow = clampViewLow(scrollTargetLow);
        viewLow += (scrollTargetLow - viewLow) * 0.15;
        if (Math.abs(scrollTargetLow - viewLow) < 0.01) {
          viewLow = scrollTargetLow;
          scrollTargetLow = null;
        }
      }
      const viewHigh = viewLow + VIEW_SPAN;

      const yOf = (midi) => topPad + ((viewHigh - midi) / (viewHigh - viewLow)) * plotH;
      const xOf = (t) => leftPad + (1 - (now - t) / GRAPH_WINDOW) * plotW;

      ctx.clearRect(0, 0, w, h);

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, topPad, w, plotH);
      ctx.clip();

      // Note rows (piano-roll style) and labels.
      const blackSet = new Set([1, 3, 6, 8, 10]);
      const rowH = plotH / (viewHigh - viewLow);
      ctx.font = "10px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let m = Math.floor(viewLow); m <= Math.ceil(viewHigh); m++) {
        const yTop = yOf(m + 0.5);
        const yBot = yOf(m - 0.5);
        const pc = ((m % 12) + 12) % 12;
        ctx.fillStyle = blackSet.has(pc) ? "#0c1016" : "#131a24";
        ctx.fillRect(leftPad, yTop, plotW, yBot - yTop);

        if (pc === 0) {
          ctx.strokeStyle = "#3a4354";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(leftPad, yBot);
          ctx.lineTo(w - rightPad, yBot);
          ctx.stroke();
        }

        let label = false;
        if (rowH >= 16) label = true;
        else if (rowH >= 11) label = !blackSet.has(pc);
        else label = pc === 0 || pc === 5;
        const yMid = (yTop + yBot) / 2;
        if (yMid < topPad + 6 || yMid > topPad + plotH - 6) label = false;
        if (label) {
          ctx.fillStyle = pc === 0 ? "#c8d0dd" : (blackSet.has(pc) ? "#5f6878" : "#7f8898");
          ctx.fillText(noteNameFromMidi(m), leftPad - 5, yMid);
        }
      }

      // Time grid, one line per second.
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.lineWidth = 1;
      for (let sec = Math.ceil(now - GRAPH_WINDOW); sec <= now; sec++) {
        const x = xOf(sec);
        ctx.beginPath();
        ctx.moveTo(x, topPad);
        ctx.lineTo(x, topPad + plotH);
        ctx.stroke();
      }

      // Played (target) notes as bars.
      for (const ev of targetEvents) {
        const x1 = Math.max(leftPad, xOf(ev.start));
        const x2 = Math.min(w - rightPad, xOf(ev.end === null ? now : ev.end));
        if (x2 <= leftPad) continue;
        const yTop = yOf(ev.midi + 0.5);
        const yBot = yOf(ev.midi - 0.5);
        ctx.fillStyle = "rgba(88, 166, 255, 0.3)";
        ctx.fillRect(x1, yTop, Math.max(2, x2 - x1), yBot - yTop);
        ctx.fillStyle = "rgba(88, 166, 255, 0.35)";
        ctx.fillRect(x1, yOf(ev.midi + 0.1), Math.max(2, x2 - x1), yOf(ev.midi - 0.1) - yOf(ev.midi + 0.1));
        ctx.strokeStyle = "rgba(140, 195, 255, 0.9)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x1, (yTop + yBot) / 2);
        ctx.lineTo(x2, (yTop + yBot) / 2);
        ctx.stroke();
      }

      // Sung pitch trace, colored by distance from the reference note.
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      let prev = null;
      for (const smp of pitchSamples) {
        if (smp.t < now - GRAPH_WINDOW - 0.2) continue;
        if (smp.midi === null) {
          prev = null;
          continue;
        }
        if (prev && smp.t - prev.t < 0.15) {
          const ref = smp.ref !== null ? smp.ref : Math.round(smp.midi);
          ctx.strokeStyle = traceColor(Math.abs(smp.midi - ref) * 100);
          ctx.beginPath();
          ctx.moveTo(xOf(prev.t), yOf(prev.midi));
          ctx.lineTo(xOf(smp.t), yOf(smp.midi));
          ctx.stroke();
        }
        prev = smp;
      }

      // Current point marker.
      const last = pitchSamples[pitchSamples.length - 1];
      if (last && last.midi !== null && now - last.t < 0.15) {
        const ref = last.ref !== null ? last.ref : Math.round(last.midi);
        ctx.fillStyle = traceColor(Math.abs(last.midi - ref) * 100);
        ctx.beginPath();
        ctx.arc(xOf(last.t), yOf(last.midi), 4, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();

      // Time axis labels.
      ctx.fillStyle = "#7f8898";
      ctx.font = "10px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for (let sec = Math.ceil(now - GRAPH_WINDOW); sec <= now; sec += 2) {
        const ago = Math.round(now - sec);
        ctx.fillText(ago === 0 ? "now" : `-${ago}s`, xOf(sec), topPad + plotH + 4);
      }

      if (graphPaused) {
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.font = "bold 12px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        ctx.fillText("PAUSED", w - rightPad - 6, topPad + 6);
      }
    }

    function clampViewLow(low) {
      return Math.max(VIEW_MIN, Math.min(VIEW_MAX - VIEW_SPAN, low));
    }

    // The pitch auto-follow wants to keep in view: a held key first, then the voice.
    function focusMidi(now) {
      let latest = null;
      for (const ev of activeTargetEvents.values()) {
        if (latest === null || ev.start > latest.start) latest = ev;
      }
      if (latest) return latest.midi;
      const last = pitchSamples[pitchSamples.length - 1];
      if (last && last.midi !== null && now - last.t < 0.5) return last.midi;
      return null;
    }

    function setFollow(on) {
      followMode = on;
      followBtn.classList.toggle("active", on);
      if (on) {
        const focus = focusMidi(nowSec());
        if (focus !== null) scrollTargetLow = focus - VIEW_SPAN / 2;
      }
    }

    function semitonesPerPixel() {
      const rect = graphCanvas.getBoundingClientRect();
      const plotH = rect.height - PAD.top - PAD.bottom;
      return VIEW_SPAN / Math.max(1, plotH);
    }

    graphCanvas.addEventListener("pointerdown", (e) => {
      drag = { y: e.clientY, low: viewLow, moved: false, id: e.pointerId };
      graphCanvas.setPointerCapture(e.pointerId);
    });

    graphCanvas.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dy) < 4) return;
      drag.moved = true;
      graphCanvas.classList.add("dragging");
      scrollTargetLow = null;
      if (followMode) setFollow(false);
      viewLow = clampViewLow(drag.low + dy * semitonesPerPixel());
    });

    const endDrag = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      drag = null;
      graphCanvas.classList.remove("dragging");
    };
    graphCanvas.addEventListener("pointerup", endDrag);
    graphCanvas.addEventListener("pointercancel", endDrag);

    graphCanvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      scrollTargetLow = null;
      if (followMode) setFollow(false);
      viewLow = clampViewLow(viewLow + e.deltaY * semitonesPerPixel());
    }, { passive: false });

    followBtn.addEventListener("click", () => setFollow(!followMode));

    function detectFrequency() {
      analyser.getFloatTimeDomainData(tunerData);
      let freq = autoCorrelate(tunerData, audioCtx.sampleRate);
      if (freq === -1 || !isFinite(freq) || freq < MIN_FREQ || freq > MAX_FREQ) {
        recentFreqs = [];
        return null;
      }
      // Median of the last three readings to knock out single-frame glitches.
      recentFreqs.push(freq);
      if (recentFreqs.length > 3) recentFreqs.shift();
      if (recentFreqs.length === 3) {
        freq = [...recentFreqs].sort((a, b) => a - b)[1];
      }
      return freq;
    }

    function tick() {
      const now = nowSec();

      if (tunerActive && analyser && audioCtx) {
        const freq = detectFrequency();
        if (!graphPaused) {
          pitchSamples.push({
            t: now,
            midi: freq === null ? null : midiFloatFromFreq(freq),
            ref: targetMidi
          });
        }
      }

      if (!graphPaused) pruneHistory(now);
      drawGraph(graphPaused ? graphFrozenAt : now);

      requestAnimationFrame(tick);
    }

    pauseGraphBtn.addEventListener("click", () => {
      graphPaused = !graphPaused;
      graphFrozenAt = nowSec();
      pauseGraphBtn.textContent = graphPaused ? "Resume" : "Pause";
    });

    clearGraphBtn.addEventListener("click", () => {
      const now = nowSec();
      pitchSamples.length = 0;
      for (let i = targetEvents.length - 1; i >= 0; i--) {
        if (targetEvents[i].end !== null) targetEvents.splice(i, 1);
        else targetEvents[i].start = now;
      }
      if (graphPaused) graphFrozenAt = now;
    });

    micBtn.addEventListener("click", async () => {
      try {
        await enableMic();
      } catch (err) {
        statusEl.textContent = `Mic failed: ${err.message}`;
      }
    });

    octaveDownBtn.addEventListener("click", () => {
      if (displayStartOctave > 1) {
        displayStartOctave--;
        buildKeyboard();
      }
    });

    octaveUpBtn.addEventListener("click", () => {
      if (displayStartOctave < 6) {
        displayStartOctave++;
        buildKeyboard();
      }
    });

    volumeEl.addEventListener("input", () => {
      if (masterGain) {
        masterGain.gain.value = parseFloat(volumeEl.value);
      }
    });

    window.addEventListener("resize", () => {
      buildKeyboard();
      resizeGraph();
    });

    buildKeyboard();
    resizeGraph();
    tick();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
